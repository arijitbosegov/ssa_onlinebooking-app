
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | SAPTA SHAKTI AUDITORIUM</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
}

.container {
    width: 100%;
    max-width: 440px;
    padding: 35px 30px;
    background: #1b304d;
    border: 1px solid #354a63;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,.35);
}

h1 {
    text-align: center;
    color: #e2b75e;
    font-size: 24px;
    letter-spacing: 1px;
}

.subtitle {
    text-align: center;
    color: #d0d7e2;
    margin: 12px 0 28px;
    font-size: 14px;
}

label {
    display: block;
    margin: 17px 0 7px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #8291a5;
    border-radius: 6px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 6px;
    background: #8b1e2d;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background: #a92739; }
button:disabled { opacity: .6; cursor: not-allowed; }

.hidden { display: none; }

#message {
    display: none;
    margin-top: 17px;
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.5;
}

.links {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
}

.links a {
    color: #e2b75e;
    text-decoration: none;
}

.links a:hover { text-decoration: underline; }
</style>
</head>

<body>

<div class="container">

<h1>SAPTA SHAKTI AUDITORIUM</h1>
<div class="subtitle">RESET YOUR PASSWORD</div>

<!-- Step 1: Request OTP -->
<form id="requestForm">

    <label for="email">Registered Email Address</label>
    <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        autocomplete="email"
        required
    >

    <button type="submit" id="sendButton">
        SEND OTP
    </button>

</form>

<!-- Step 2: Verify OTP -->
<form id="verifyForm" class="hidden">

    <label for="otp">Six-Digit Email OTP</label>
    <input
        type="text"
        id="otp"
        inputmode="numeric"
        maxlength="6"
        pattern="[0-9]{6}"
        placeholder="Enter OTP"
        autocomplete="one-time-code"
        required
    >

    <button type="submit" id="verifyButton">
        VERIFY OTP
    </button>

</form>

<!-- Step 3: Set new password -->
<form id="resetForm" class="hidden">

    <label for="newPassword">New Password</label>
    <input
        type="password"
        id="newPassword"
        minlength="12"
        maxlength="128"
        autocomplete="new-password"
        placeholder="Minimum 12 characters"
        required
    >

    <label for="confirmPassword">Confirm New Password</label>
    <input
        type="password"
        id="confirmPassword"
        minlength="12"
        maxlength="128"
        autocomplete="new-password"
        placeholder="Re-enter new password"
        required
    >

    <button type="submit" id="resetButton">
        RESET PASSWORD
    </button>

</form>

<div id="message" role="status" aria-live="polite"></div>

<div class="links">
    <a href="login.html">Back to Login</a>
    <br><br>
    <a href="index.html">Back to Home</a>
</div>

</div>

<script>
const requestForm = document.getElementById("requestForm");
const verifyForm = document.getElementById("verifyForm");
const resetForm = document.getElementById("resetForm");
const messageBox = document.getElementById("message");

let resetToken = null;
let resetTokenExpiresAt = 0;

function showMessage(message, success = false) {
    messageBox.style.display = "block";
    messageBox.textContent = message;
    messageBox.style.background = success ? "#173f32" : "#57232b";
    messageBox.style.color = "#ffffff";
}

function setLoading(button, loading, normalText) {
    button.disabled = loading;
    button.textContent = loading ? "PLEASE WAIT..." : normalText;
}

async function postJSON(url, body) {
    const response = await fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        credentials: "same-origin",
        body: JSON.stringify(body)
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
        throw new Error(result.message || "Request failed.");
    }

    return result;
}

// Step 1: Send OTP
requestForm.addEventListener("submit", async event => {
    event.preventDefault();

    const button = document.getElementById("sendButton");
    setLoading(button, true, "SEND OTP");
    messageBox.style.display = "none";

    const email = document.getElementById("email").value.trim();

    try {
        const result = await postJSON("/api/forgot-password", { email });

        requestForm.classList.add("hidden");
        verifyForm.classList.remove("hidden");

        showMessage(
            result.message + " If eligible, check your email for the OTP.",
            true
        );

    } catch (error) {
        showMessage(error.message);
        setLoading(button, false, "SEND OTP");
    }
});

// Step 2: Verify OTP
verifyForm.addEventListener("submit", async event => {
    event.preventDefault();

    const button = document.getElementById("verifyButton");
    setLoading(button, true, "VERIFY OTP");
    messageBox.style.display = "none";

    const email = document.getElementById("email").value.trim();
    const otp = document.getElementById("otp").value.trim();

    try {
        const result = await postJSON("/api/verify-reset-otp", {
            email,
            otp
        });

        if (
            typeof result.resetToken !== "string" ||
            !/^[a-f0-9]{64}$/i.test(result.resetToken) ||
            result.resetTokenExpiresInSeconds !== 600
        ) {
            throw new Error("Invalid reset authorization response.");
        }

        resetToken = result.resetToken;
        resetTokenExpiresAt = Date.now() + 600000;

        verifyForm.classList.add("hidden");
        resetForm.classList.remove("hidden");

        showMessage("OTP verified. You can now set a new password.", true);

    } catch (error) {
        showMessage(error.message);
        setLoading(button, false, "VERIFY OTP");
    }
});

// Step 3: Reset password
resetForm.addEventListener("submit", async event => {
    event.preventDefault();

    const button = document.getElementById("resetButton");
    setLoading(button, true, "RESET PASSWORD");
    messageBox.style.display = "none";

    const email = document.getElementById("email").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
        showMessage("The passwords do not match.");
        setLoading(button, false, "RESET PASSWORD");
        return;
    }

    if (newPassword.length < 12 || newPassword.length > 128) {
        showMessage("Password must contain 12 to 128 characters.");
        setLoading(button, false, "RESET PASSWORD");
        return;
    }

    if (!resetToken || Date.now() >= resetTokenExpiresAt) {
        resetToken = null;
        showMessage("Your reset session has expired. Please request a new OTP.");
        resetForm.classList.add("hidden");
        requestForm.classList.remove("hidden");
        setLoading(button, false, "RESET PASSWORD");
        return;
    }

    try {
        const result = await postJSON("/api/reset-password", {
            email,
            resetToken,
            newPassword
        });

        resetToken = null;
        resetTokenExpiresAt = 0;

        resetForm.classList.add("hidden");

        showMessage(
            result.message + " Redirecting to login...",
            true
        );

        setTimeout(() => {
            window.location.href = "login.html";
        }, 2500);

    } catch (error) {
        showMessage(error.message);
        setLoading(button, false, "RESET PASSWORD");
    }
});
</script>

</body>
</html>
