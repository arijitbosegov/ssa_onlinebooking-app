
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | SAPTA SHAKTI AUDITORIUM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      padding: 35px 30px;
      background: #1b304d;
      border: 1px solid #354a63;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #e2b75e;
      font-size: 25px;
      letter-spacing: 1px;
      line-height: 1.4;
    }

    .subtitle {
      text-align: center;
      color: #d0d7e2;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      color: #f1f1f1;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #8291a5;
      border-radius: 6px;
      background: #ffffff;
      color: #172033;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #e2b75e;
      border-color: #e2b75e;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #8b1e2d;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #a92739;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .links {
      margin-top: 23px;
      text-align: center;
      font-size: 14px;
      line-height: 2;
    }

    .links a {
      color: #e2b75e;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .forgot-link {
      display: inline-block;
      margin-bottom: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <h1>SAPTA SHAKTI AUDITORIUM</h1>

    <div class="subtitle">USER LOGIN</div>

    <form id="loginForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your registered email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        LOGIN
      </button>

    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="links">

      <a
        href="forgot-password.html"
        class="forgot-link"
      >
        Forgot Password?
      </a>

      <br>

      Don't have an account?
      <a href="register.html">Register Here</a>

      <br>

      <a href="index.html">Back to Home</a>

    </div>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");

    function showMessage(message, success = false) {
      messageBox.style.display = "block";
      messageBox.textContent = message;

      messageBox.style.background = success
        ? "#173f32"
        : "#57232b";

      messageBox.style.color = "#ffffff";
    }

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      loginButton.disabled = true;
      loginButton.textContent = "PLEASE WAIT...";

      messageBox.style.display = "none";

      const email = document
        .getElementById("email")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      try {

        const response = await fetch("/api/login", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          credentials: "same-origin",

          body: JSON.stringify({
            email: email,
            password: password
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.message ||
            "Login failed. Please check your credentials."
          );
        }

        showMessage(
          "Login successful. Redirecting to your dashboard...",
          true
        );

        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 1000);

      } catch (error) {

        showMessage(
          error.message ||
          "Unable to log in. Please try again."
        );

        loginButton.disabled = false;
        loginButton.textContent = "LOGIN";
      }

    });
  </script>

</body>
</html>
